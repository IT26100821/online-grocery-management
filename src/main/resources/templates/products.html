<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GreenMart - Product Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
        }

        .navbar {
            background: #198754;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1, h2 {
            color: #198754;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #198754;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #198754;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .table-wrapper {
            overflow-x: auto;
        }


        /* PRODUCT PHOTO UPLOAD DESIGN */

        .product-photo-group {
            margin-top: 28px;
            margin-bottom: 30px;
        }

        .product-photo-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .product-photo-group input[type="file"] {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid #d5e5d9;
            border-radius: 10px;
            background: #f8fcf9;
            cursor: pointer;
        }

        .photo-hint {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            color: #738478;
        }

        /* IMAGE PREVIEW */

        .image-preview-container {
            margin-top: 22px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f1f8f2;
            border: 1px dashed #a9d4b8;
            border-radius: 14px;
            text-align: center;
        }

        .preview-title {
            font-weight: 600;
            color: #198754;
            margin-bottom: 15px;
        }

        .image-preview {
            width: 210px;
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #d5ebda;
        }


    </style>
</head>

<body>

<div class="navbar">
    <h2 style="color:white;">🛒 GreenMart Admin</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>

<div class="container">

    <h1>🥦 Product Management</h1>

    <p>Manage grocery products and inventory</p>

    <!-- Add Product Form -->

    <div class="card">

        <h2>Add New Product</h2>


        <form th:action="@{/products/add}"
              method="post"
              enctype="multipart/form-data">


        <label>Product Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter product name"
                   required>

            <label>Category</label>
            <input type="text"
                   name="category"
                   placeholder="Enter category"
                   required>

            <label>Price (Rs.)</label>
            <input type="number"
                   name="price"
                   min="0"
                   step="0.01"
                   placeholder="Enter price"
                   required>

            <label>Stock Quantity</label>
            <input type="number"
                   name="quantity"
                   min="0"
                   step="1"
                   placeholder="Enter quantity"
                   required>


            <!-- PRODUCT IMAGE UPLOAD -->
            <div class="form-group product-photo-group">

                <label for="productImage">
                    📷 Product Photo
                </label>

                <input type="file"
                       id="productImage"
                       name="image"
                       accept=".jpg,.jpeg,.png,image/jpeg,image/png">

                <small class="photo-hint">
                    Choose a JPG or PNG image (Maximum 5MB)
                </small>

                <!-- PHOTO PREVIEW -->
                <div id="imagePreviewContainer"
                     class="image-preview-container"
                     style="display:none;">

                    <p class="preview-title">
                        Selected Product Photo
                    </p>

                    <img id="imagePreview"
                         alt="Product photo preview"
                         class="image-preview">

                </div>

            </div>

            <!-- ADD PRODUCT BUTTON -->
            <button type="submit">
                Add Product
            </button>



        </form>

    </div>

    <!-- Product List -->

    <div class="card">

        <h2>Product List</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th> <th>Photo</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="product : ${products}">

                    <td th:text="${product.id}"></td>

                    <td th:text="${product.name}"></td>


                    <!-- PRODUCT PHOTO -->
                    <td>
                        <img th:if="${product.imageFileName != null
                 and !#strings.isEmpty(product.imageFileName)}"
                             th:src="@{/product-images/{fileName}(fileName=${product.imageFileName})}"
                             th:alt="${product.name}"
                             style="width:65px;
                height:65px;
                object-fit:cover;
                border-radius:10px;">

                        <span th:unless="${product.imageFileName != null
                      and !#strings.isEmpty(product.imageFileName)}">
        📦
    </span>
                    </td>


                    <td th:text="${product.category}"></td>

                    <td th:text="${product.price}"></td>

                    <td th:text="${product.quantity}"></td>

                    <td>

                        <!-- Edit Product Button -->
                        <a th:href="@{/products/edit/{id}(id=${product.id})}"
                           style="background:#ffc107;
              color:black;
              padding:10px 15px;
              border-radius:5px;
              text-decoration:none;
              display:inline-block;">

                            Edit
                        </a>

                        <!-- Delete Product Button -->
                        <form th:action="@{/products/delete/{id}(id=${product.id})}"
                              method="post"
                              style="display:inline-block;"
                              onsubmit="return confirm('Are you sure you want to delete this product?');">

                            <button type="submit"
                                    style="background:#dc3545;
                       color:white;
                       padding:10px 15px;
                       margin-top:0;">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6">
                        No products added yet.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    document.addEventListener("DOMContentLoaded", function () {

        const imageInput =
            document.getElementById("productImage");

        const preview =
            document.getElementById("imagePreview");

        const previewContainer =
            document.getElementById("imagePreviewContainer");

        imageInput.addEventListener("change", function () {

            const file = this.files[0];

            previewContainer.style.display = "none";
            preview.removeAttribute("src");

            if (!file) {
                return;
            }

            // Allow JPG and PNG only
            if (!["image/jpeg", "image/png"].includes(file.type)) {

                alert("Please select a JPG or PNG image.");
                this.value = "";
                return;
            }

            // Maximum size 5 MB
            if (file.size > 5 * 1024 * 1024) {

                alert("Image size must be less than 5MB.");
                this.value = "";
                return;
            }

            // Preview selected image
            const reader = new FileReader();

            reader.onload = function (event) {

                preview.src = event.target.result;

                previewContainer.style.display = "block";
            };

            reader.readAsDataURL(file);

        });

    });

</script>


</body>
</html>
