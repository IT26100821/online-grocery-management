<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GreenMart - Edit Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8f4;
            margin: 0;
        }

        .navbar {
            background: #198754;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
        }

        h1 {
            color: #198754;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #198754;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            margin-top: 25px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #198754;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>🛒 GreenMart Admin</h2>

</div>

<div class="container">

    <div class="card">

        <h1>✏️ Edit Product</h1>

        <form th:action="@{/products/update/{id}(id=${product.id})}"
              method="post">

            <label>Product Name</label>

            <input type="text"
                   name="name"
                   th:value="${product.name}"
                   required>

            <label>Category</label>

            <input type="text"
                   name="category"
                   th:value="${product.category}"
                   required>

            <label>Price (Rs.)</label>

            <input type="number"
                   name="price"
                   min="0"
                   step="0.01"
                   th:value="${product.price}"
                   required>

            <label>Stock Quantity</label>

            <input type="number"
                   name="quantity"
                   min="0"
                   step="1"
                   th:value="${product.quantity}"
                   required>

            <button type="submit">
                Update Product
            </button>

        </form>

        <a href="/products" class="back">
            ← Back to Products
        </a>

    </div>

</div>

</body>
</html>
