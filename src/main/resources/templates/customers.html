<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GreenMart - Customer Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
        }

        .navbar {
            background: #198754;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1, h2 {
            color: #198754;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #198754;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #198754;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .delete-btn {
            background: #dc3545;
            margin-top: 0;
            padding: 10px 15px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2 style="color:white;">🛒 GreenMart Admin</h2>

    <a href="/dashboard">Back to Dashboard</a>

</div>

<div class="container">

    <h1>👤 Customer Management</h1>

    <p>Manage registered customers</p>

    <!-- Add Customer Form -->

    <div class="card">

        <h2>Add New Customer</h2>

        <form th:action="@{/customers/add}" method="post">

            <label>Customer Full Name</label>

            <input type="text"
                   name="fullName"
                   placeholder="Enter full name"
                   required>

            <label>Email Address</label>

            <input type="email"
                   name="email"
                   placeholder="Enter email"
                   required>

            <label>Phone Number</label>

            <input type="tel"
                   name="phone"
                   placeholder="Enter phone number"
                   required>

            <button type="submit">
                Add Customer
            </button>

        </form>

    </div>

    <!-- Customer List -->

    <div class="card">

        <h2>Customer List</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="customer : ${customers}">

                    <td th:text="${customer.id}"></td>

                    <td th:text="${customer.fullName}"></td>

                    <td th:text="${customer.email}"></td>

                    <td th:text="${customer.phone}"></td>

                    <td>

                        <a th:href="@{/customers/edit/{id}(id=${customer.id})}"
                           style="background:#ffc107;
          color:black;
          padding:10px 15px;
          border-radius:5px;
          text-decoration:none;
          display:inline-block;
          margin-right:15px;">
                            Edit
                        </a>

                        <form th:action="@{/customers/delete/{id}(id=${customer.id})}"
                              method="post"
                              style="display:inline-block;"
                              onsubmit="return confirm('Delete this customer?');">

                            <button type="submit"
                                    class="delete-btn">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="5">
                        No customers added yet.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
