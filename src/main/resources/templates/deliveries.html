
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GreenMart - Delivery Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
        }

        .navbar {
            background: #198754;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1, h2 {
            color: #198754;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #198754;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .edit-btn {
            background: #ffc107;
            color: black;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 10px 15px;
            margin-top: 0;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            background: #e2f3e8;
            color: #146c43;
        }

        .error {
            background: #ffe5e5;
            color: #b42318;
        }

        .actions {
            white-space: nowrap;
        }

        .actions form {
            display: inline-block;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<div class="navbar">
    <h2>🛒 GreenMart Admin</h2>
    <a href="/dashboard">Back to Dashboard</a>
</div>

<div class="container">

    <h1>🚚 Delivery Management</h1>
    <p>Manage grocery order deliveries</p>

    <!-- Success Message -->
    <p class="message success"
       th:if="${success}"
       th:text="${success}">
    </p>

    <!-- Error Message -->
    <p class="message error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <!-- Add Delivery Form -->
    <div class="card">

        <h2>Add New Delivery</h2>

        <form th:action="@{/deliveries/add}"
              method="post">

            <!-- Select Order -->
            <label for="orderId">Select Order</label>

            <select id="orderId" name="orderId" required>

                <option value="" selected disabled>
                    Select Order
                </option>

                <option th:each="order : ${orders}"
                        th:value="${order.id}"
                        th:text="${'Order #' + order.id}">
                </option>

            </select>

            <!-- Delivery Address -->
            <label for="deliveryAddress">
                Delivery Address
            </label>

            <input type="text"
                   id="deliveryAddress"
                   name="deliveryAddress"
                   placeholder="Enter delivery address"
                   maxlength="200"
                   required>

            <!-- Delivery Date -->
            <label for="deliveryDate">
                Delivery Date
            </label>

            <input type="date"
                   id="deliveryDate"
                   name="deliveryDate"
                   required>

            <p>
                New deliveries will start with Pending status.
            </p>

            <button type="submit">
                Add Delivery
            </button>

        </form>

    </div>

    <!-- Delivery List -->
    <div class="card">

        <h2>Delivery Records</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>Delivery ID</th>
                    <th>Order ID</th>
                    <th>Delivery Address</th>
                    <th>Delivery Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="delivery : ${deliveries}">

                    <td th:text="${delivery.id}">
                    </td>

                    <td th:text="${delivery.orderId}">
                    </td>

                    <td th:text="${delivery.deliveryAddress}">
                    </td>

                    <td th:text="${delivery.deliveryDate}">
                    </td>

                    <td th:text="${delivery.deliveryStatus}">
                    </td>

                    <td class="actions">

                        <!-- Edit -->
                        <a class="edit-btn"
                           th:href="@{/deliveries/edit/{id}(id=${delivery.id})}">
                            Edit
                        </a>

                        <!-- Delete -->
                        <form th:action="@{/deliveries/delete/{id}(id=${delivery.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this delivery?');">

                            <button type="submit"
                                    class="delete-btn">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(deliveries)}">
                    <td colspan="6">
                        No deliveries added yet.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
