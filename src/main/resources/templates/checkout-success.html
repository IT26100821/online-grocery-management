
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>GreenMart | Order Placed</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7faf7;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #123d2d;
        }

        .success-card {
            background: white;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            max-width: 480px;
            margin: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
        }

        .check {
            font-size: 65px;
            color: #198754;
        }

        a {
            display: inline-block;
            background: #198754;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="success-card">

    <div class="check">✓</div>

    <h1>Order Placed!</h1>

    <p>Your order has been submitted successfully.</p>

    <p>
        Order Records:
        <strong th:text="${orderCount}">1</strong>
    </p>

    <h2 th:text="|Rs. ${#numbers.formatDecimal(grandTotal, 1, 2)}|">
        Rs. 0.00
    </h2>

    <p>Status: Pending</p>

    <p>Payment and delivery processing will follow.</p>

    <a th:href="@{/}">Continue Shopping</a>

</div>

<script th:inline="javascript">
    const username = /*[[${username}]]*/ "";
    sessionStorage.removeItem("greenMartCart:" + username);
</script>

</body>
</html>
